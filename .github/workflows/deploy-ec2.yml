name: Deploy to EC2 (legado, manual)

# Legado: o deploy automático para EC2 falhava desde março e o dono não quer manter infraestrutura
# paga. Fica apenas manual (workflow_dispatch); nunca roda em push nem em pull_request.
# O contexto secrets não é permitido em environment.url: era isso que fazia cada push gerar uma
# execução com falha ("workflow file issue", 0 jobs). A URL foi removida.
# Deploy gratuito atual: render.yaml (API) + frontend/vercel.json (ver README, "Deploy gratuito").
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/ordersystem

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Setting up environment ==="
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "WARNING: .env created from template — set real secrets before continuing"
              exit 1
            fi

            echo "=== Building and restarting services ==="
            docker compose pull postgres rabbitmq redis payment-sandbox
            docker compose up -d --build --remove-orphans unified-order-system frontend

            echo "=== Waiting for health check ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && curl -sf http://localhost:4200/login > /dev/null 2>&1; then
                echo "Application and frontend are healthy"
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 10
            done

            curl -sf http://localhost:8080/actuator/health || { echo "Health check failed"; exit 1; }
            curl -sf http://localhost:4200/login || { echo "Frontend health check failed"; exit 1; }

            echo "=== Cleanup old images ==="
            docker image prune -f

            echo "=== Deploy complete ==="
