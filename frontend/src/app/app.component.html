<ng-container *ngIf="authService.isAuthenticated(); else guestLayout">
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen" [class.is-mobile]="isMobile">
  <!-- Sidebar -->
  <aside id="app-sidebar" class="sidebar" [class.open]="sidebarOpen" aria-label="Sidebar">
    <div class="sidebar-header">
      <div class="logo" *ngIf="sidebarOpen">
        <span class="logo-icon" aria-hidden="true">OF</span>
        <span class="logo-text">OrderFlow</span>
      </div>
      <button
        class="sidebar-toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarOpen ? 'Collapse navigation' : 'Expand navigation'"
        [attr.aria-expanded]="sidebarOpen"
        aria-controls="app-sidebar"
      >
        <span class="hamburger" aria-hidden="true"></span>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="nav-item"
        [title]="!sidebarOpen ? item.label : ''"
      >
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path [attr.d]="item.icon" />
        </svg>
        <span class="nav-label" [class.visually-hidden]="!sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="sidebarOpen">
      <span class="version">v1.0.0</span>
    </div>
  </aside>

  <!-- Backdrop (mobile only, while the drawer is open) -->
  <div
    class="sidebar-backdrop"
    *ngIf="isMobile && sidebarOpen"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <!-- Main area -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button
          *ngIf="isMobile"
          class="topbar-menu"
          type="button"
          (click)="toggleSidebar()"
          aria-label="Open navigation"
          [attr.aria-expanded]="sidebarOpen"
          aria-controls="app-sidebar"
        >
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <span class="page-title">Order Management System</span>
      </div>
      <div class="topbar-right">
        <div class="current-user">
          <span class="current-user__name">{{ authService.getCurrentUser()?.username }}</span>
          <span class="current-user__roles">{{ authService.getCurrentUser()?.roles?.join(', ') }}</span>
        </div>
        <span
          class="ws-indicator"
          [class.ws-indicator--offline]="!(wsConnected$ | async)"
          role="status"
          [attr.title]="(wsConnected$ | async) ? 'Real-time updates connected' : 'Real-time updates disconnected'"
        >
          <span class="ws-dot" aria-hidden="true"></span>
          {{ (wsConnected$ | async) ? 'Live' : 'Offline' }}
        </span>
        <button class="btn btn-secondary btn-sm" type="button" (click)="logout()">Logout</button>
      </div>
    </header>

    <main id="main-content" class="content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Toast notifications -->
  <app-toast></app-toast>
</div>
</ng-container>

<ng-template #guestLayout>
  <router-outlet></router-outlet>
  <app-toast></app-toast>
</ng-template>
